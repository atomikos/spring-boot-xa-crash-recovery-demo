spring.application.name=xa-crash-recovery-demo

# PostgreSQL through its XA driver, so it can join a distributed transaction
# (compose.yaml enables max_prepared_transactions, which XA needs)
spring.datasource.url=jdbc:postgresql://localhost:5432/shop
spring.datasource.username=shop
spring.datasource.password=shop
spring.datasource.xa.data-source-class-name=org.postgresql.xa.PGXADataSource

# Artemis; Spring Boot creates an XA ConnectionFactory for it
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis

# Connection pools. The default is 1, which starves the app once the status page
# polls (a transaction per poll) while orders are placed and the listener ships.
# min-pool-size > 1 also pre-warms the pool and clears Atomikos's "poolSize equals
# default" warning (that warning checks the MIN size, not the max).
spring.jta.atomikos.datasource.min-pool-size=2
spring.jta.atomikos.datasource.max-pool-size=10
spring.jta.atomikos.connectionfactory.min-pool-size=2
spring.jta.atomikos.connectionfactory.max-pool-size=10

# keep the tables (and the evidence) across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# start compose.yaml if needed, but leave it running when the app stops or crashes
spring.docker.compose.lifecycle-management=start-only

# Atomikos: the transaction log is what recovery reads after a crash, so keep
# it outside target/ (a "mvn clean" must not erase it) and keep the name fixed
atomikos.properties.log-base-dir=transaction-logs
atomikos.properties.transaction-manager-unique-name=xa-crash-recovery-demo
# short timeouts so recovery happens within seconds on camera
atomikos.properties.default-jta-timeout=5s
atomikos.properties.recovery.delay=5s

logging.level.root=WARN
logging.level.com.atomikos.demo=INFO
logging.level.org.springframework.boot.web.server=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %msg%n
