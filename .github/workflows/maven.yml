name: Java CI with Maven

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rounds:
        description: Benchmark rounds (each runs naive, local-tx and xa, ~7 min)
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B verify

  # what XA costs, as a report on the run's summary page (see README, "What does XA cost?")
  benchmark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - run: ./benchmark.sh
        env:
          ROUNDS: ${{ inputs.rounds || '1' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            target/benchmark/results.csv
            target/surefire-reports/
          if-no-files-found: ignore
